name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release list --limit 30 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select((.isDraft | not) and (.isPrerelease | not))] | if length > 0 then .[0].tagName else empty end')
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(( ${BASH_REMATCH[3]} + 1 ))"
          else
            version=$(node -p "require('./package.json').version")
          fi
          if git ls-remote --exit-code --tags origin "v${version}" >/dev/null; then
            echo "::error::tag v${version} already exists; refusing to reuse it"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Creating release v${version}"

      - name: Set manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Build and check
        run: |
          npm ci
          npm run check

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -r "youtube-subscriptions-fixer-${VERSION}.zip" \
            manifest.json background.js content.js popup.js \
            content.css popup.css popup.html \
            icons README.md PRIVACY.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## v${VERSION}"
            echo
            echo "Built from commit \`${COMMIT:0:7}\`."
          } > release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            "youtube-subscriptions-fixer-${VERSION}.zip"
